<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS RESCUE — Under Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050d14;
    --accent: #00e5ff;
    --danger: #ff3b3b;
    --dim: #4a6a7d;
    --text: #c8dce8;
    --glow: 0 0 20px rgba(0,229,255,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,229,255,0.012) 2px, rgba(0,229,255,0.012) 4px
    );
    pointer-events: none;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 6px;
    text-shadow: var(--glow);
    margin-bottom: 12px;
  }
  .logo span { color: var(--danger); }

  .line {
    width: 260px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 28px auto;
  }

  .tag {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--dim);
    margin-bottom: 32px;
  }

  .message {
    font-size: clamp(13px, 2vw, 16px);
    color: var(--text);
    letter-spacing: 2px;
    text-align: center;
    line-height: 2;
  }

  .message em {
    color: var(--accent);
    font-style: normal;
    text-shadow: var(--glow);
  }
</style>
</head>
<body>

  <div class="logo">NEXUS<span>::</span>RESCUE</div>
  <div class="tag">// DISASTER ROUTE OPTIMIZER //</div>

  <div class="line"></div>

  <div class="message">
    UNDER CONSTRUCTION<br>
    we're coming back with a <em>strong upgrade.</em>
  </div>

</body>
</html>
